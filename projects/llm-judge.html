<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Judge | Damin Oh</title>
<style>
  :root { --bg:#fafaf9; --surface:#fff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e4e4e7; --accent:#1f5fbf;
    --accent-soft:#e8f0fc; --warn:#9a6200; --warn-soft:#fdf3e1; --max:860px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.65; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .wrap { max-width:var(--max); margin:0 auto; padding:0 20px; }
  header.site { border-bottom:1px solid var(--line); background:rgba(250,250,249,.92); }
  header.site .wrap { display:flex; justify-content:space-between; align-items:center; min-height:56px; }
  header.site .brand { font-weight:700; color:var(--ink); }
  main { padding:40px 0 56px; }
  .eyebrow { font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  h1 { font-size:2rem; line-height:1.3; margin:0 0 8px; }
  h2 { font-size:1.2rem; margin:28px 0 8px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; font-size:.78rem; padding:2px 9px; border-radius:999px; margin-right:6px; background:var(--accent-soft); color:var(--accent); }
  .badge.gray { background:#eeeef0; color:var(--muted); }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; margin-top:16px; }
  .rq { border-left:3px solid var(--accent); padding:4px 0 4px 14px; margin:14px 0; }
  .rq strong { display:block; }
  .pending { color:var(--warn); font-weight:600; }
  footer { padding:28px 0 44px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); }
  @media (max-width:640px) { h1 { font-size:1.6rem; } }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="brand">Damin Oh</div>
    <a href="../index.html#projects">← 프로젝트 목록</a>
  </div>
</header>

<main>
<div class="wrap">
  <div class="eyebrow">Research · 연구 관심</div>
  <h1>LLM Judge</h1>
  <p class="muted">
    <span class="badge">연구 관심</span>
    <span class="badge gray">범위 확정 필요</span>
  </p>

  <div class="panel">
    <h2 style="margin-top:0">연구 질문</h2>
    <div class="rq">
      <strong>LLM Judge의 신뢰성</strong>
      <span class="muted">보안 평가에 쓰이는 Judge의 편향과 일관성을 어떻게 측정할 것인가 <span class="pending">[문구 확정 필요]</span></span>
    </div>
    <div class="rq">
      <strong>Judge 기반 가드레일</strong>
      <span class="muted">Judge를 가드레일로 쓸 때 어떤 설계 조건에서 신뢰할 수 있는가 <span class="pending">[확인 필요]</span></span>
    </div>

    <h2>현재 상태</h2>
    <p class="pending">[작성 필요: 실험 설계 단계인지, 구현 단계인지, 관련 PIVOT+ 연결 방식]</p>
  </div>
</div>
</main>

<footer>
  <div class="wrap">© Damin Oh · 초안</div>
</footer>

</body>
</html>
